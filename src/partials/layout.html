<!doctype html>
<html lang="en-GB" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.className = "js";</script>
<title>{{title}}</title>
{{head}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="SiteResolve">
<meta property="og:locale" content="en_GB">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="{{base}}assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{base}}assets/img/apple-touch-icon.png">
<link rel="preload" href="{{base}}assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{base}}assets/css/styles.css">
<script src="{{base}}assets/js/config.js" defer></script>
<script src="{{base}}assets/js/main.js" defer></script>
</head>
<body class="{{bodyClass}}" data-base="{{base}}">
<a class="skip" href="#main">Skip to content</a>
{{> header}}
<main id="main">
{{content}}
</main>
{{> footer}}
{{> overlays}}
</body>
</html>
